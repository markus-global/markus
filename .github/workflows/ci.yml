name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Architecture guard
        run: node scripts/architecture-guard.mjs

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # 会话不变量：锁住「同一会话后续请求必须看到历史」这类跨线程语义。
      # 单元测试覆盖不到「HTTP 线程写 / worker 读」那一段，所以单列一步、必过。
      - name: Session continuity invariants
        run: npx vitest run packages/core/test/conversation-session-invariants.test.ts packages/core/test/session-continuity-smoke.test.ts packages/org-manager/test/session-continuity-http.test.ts
