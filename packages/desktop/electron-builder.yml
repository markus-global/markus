appId: com.markus.desktop
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
productName: Markus
# Deep links: markus://auth, markus://install, … (macOS Info.plist + Windows registry via NSIS)
protocols:
  - name: Markus
    schemes:
      - markus
directories:
  output: dist-electron
  buildResources: build
files:
  - dist/**/*
  - "!dist/**/*.map"
  - node_modules/node-pty/**/*
  - node_modules/node-addon-api/**/*
  # Windows x64 builds must not ship arm64 ConPTY helpers (wrong arch + extra
  # OpenConsole.exe copies that complicate upgrades / file locks).
  - "!**/node-pty/prebuilds/win32-arm64/**"
  - "!**/node-pty/third_party/conpty/**/win10-arm64/**"
asar: true
asarUnpack:
  - dist/preload.js
  - dist/splash.html
  - dist/icon.png
  - dist/templates/**
  - dist/markus-browser-extension.zip
  - dist/data/**
  - node_modules/node-pty/**/*
  - "!**/node-pty/prebuilds/win32-arm64/**"
  - "!**/node-pty/third_party/conpty/**/win10-arm64/**"
compression: maximum

mac:
  category: public.app-category.developer-tools
  # Arch is selected by CLI (`--arm64` / `--x64`). Do not list both here —
  # that made each CI matrix job build arm64+x64 and upload duplicate DMGs.
  target:
    - dmg
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
  icon: build/icon.icns

dmg:
  # APFS avoids HFS+ create/mount corruption on macOS 26 Tahoe runners
  # (GitHub macos-latest). HFS+ produced INVALID arm64 DMGs that Finder
  # refuses to open (hdiutil: "映像数据已损坏").
  filesystem: APFS
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64]
  executableName: Markus
  icon: build/icon.ico
  # Full Windows signing (app exe + installer) via Certum SimplySign. The custom
  # signer shells out to `ssign`; it no-ops when CERTUM_* env vars are absent so
  # local/unsigned builds still work. See build/sign.cjs.
  #
  # SHA-256 only (no SHA-1): SHA-1 Authenticode is deprecated, and dual-signing
  # would invoke the custom signer — hence `ssign` and a SimplySign login — twice
  # per file, doubling the TOTP logins for no trust benefit.
  signtoolOptions:
    sign: build/sign.cjs
    signingHashAlgorithms:
      - sha256

nsis:
  artifactName: "Markus-Setup-${version}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # Per-user install: do not prompt for admin elevation (avoids UAC dead-ends and
  # keeps shortcuts/protocol registration in HKCU where customCheckAppRunning works).
  allowElevation: false
  # No elevate helper binary — avoids extra processes that confuse "app running" checks
  # and is unnecessary when allowElevation is false.
  packElevateHelper: false
  # Stock keepShortcuts can still skip recreation on upgrades; markus-installer.nsh
  # always recreates Desktop/Start Menu .lnk after a verified extract.
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Markus
  # Must NOT be named installer.nsh (reserved by electron-builder).
  # (menuCategory must stay unset — YAML false becomes MENU_FILENAME=false.)
  include: markus-installer.nsh

linux:
  executableName: markus
  target:
    - target: AppImage
      arch: [x64]
  category: Development
  icon: build/icon.png

publish:
  provider: github
  owner: markus-global
  repo: markus
