appId: com.markus.desktop
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
productName: Markus
# Deep links: markus://auth, markus://install, … (macOS Info.plist + Windows registry via NSIS)
protocols:
  - name: Markus
    schemes:
      - markus
directories:
  output: dist-electron
  buildResources: build
files:
  - dist/**/*
  - "!dist/**/*.map"
asar: true
asarUnpack:
  - dist/preload.js
  - dist/splash.html
  - dist/icon.png
  - dist/templates/**
  - dist/markus-browser-extension.zip
  - dist/data/**
compression: maximum

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
  icon: build/icon.icns

dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # Full Windows signing (app exe + installer) via Certum SimplySign. The custom
  # signer shells out to `ssign`; it no-ops when CERTUM_* env vars are absent so
  # local/unsigned builds still work. See build/sign.cjs.
  #
  # SHA-256 only (no SHA-1): SHA-1 Authenticode is deprecated, and dual-signing
  # would invoke the custom signer — hence `ssign` and a SimplySign login — twice
  # per file, doubling the TOTP logins for no trust benefit.
  signtoolOptions:
    sign: build/sign.cjs
    signingHashAlgorithms:
      - sha256

nsis:
  artifactName: "Markus-Setup-${version}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Explicit HKCU protocol registration (see build/installer.nsh) — required for
  # per-user Windows installs so Hub login can return via markus://auth.
  include: build/installer.nsh

linux:
  executableName: markus
  target:
    - target: AppImage
      arch: [x64]
  category: Development
  icon: build/icon.png

publish:
  provider: github
  owner: markus-global
  repo: markus
